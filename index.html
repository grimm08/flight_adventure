<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Adventure</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <button id="homeBtn" class="hidden">Home</button>
    <a id="logo" href="index.html">Flight Adventure</a>
    <div id="menu"></div>
  </header>

  <main>
    <!-- home page -->
    <section id="home">
      <div class="plane">&#9992;</div>
      <h1>Fly around the world</h1>
      <p>Reach a random target country before your money runs out.</p>
      <div>
        <button id="playBtn" class="big">Play</button>
        <button id="howBtn" class="big">How it works</button>
        <button id="helpBtn" class="big">Help?</button>
      </div>
      <button id="demoBtn" class="link">Watch a demo flight</button>
    </section>

    <!-- game page -->
    <section id="game" class="hidden">
      <div id="map"></div>

      <div id="guestBox" class="panel hidden">
        <h2>Demo flight</h2>
        <p>Sign in or register to play for real.</p>
        <button id="guestPlay">Sign in or register</button>
      </div>

      <div id="hud" class="panel hidden"></div>
      <div id="stopPanel" class="panel hidden"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Flight Game. Made by Inocent, Akil , Filmon and Jounas.</p>
  </footer>

  <!-- pop-up window -->
  <div id="overlay" class="hidden">
    <div id="modal"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="airports.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
